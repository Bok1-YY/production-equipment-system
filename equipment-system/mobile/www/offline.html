<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>暂时无法连接</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #f3f6f2; color: #183326; font-family: sans-serif; }
    main { max-width: 420px; margin: 24px; padding: 28px; border-radius: 18px;
      background: white; box-shadow: 0 12px 40px #18332618; }
    h1 { font-size: 24px; }
    p { line-height: 1.7; color: #506158; }
    button { width: 100%; border: 0; border-radius: 10px; padding: 14px;
      background: #21643c; color: white; font-size: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>暂时无法连接电脑</h1>
    <p>请确认电脑上的“手机测试服务”已经启动，并且电脑与手机连接同一个 Wi-Fi。电脑 IP 改变后，需要重新打包并安装测试版。</p>
    <button type="button" onclick="location.reload()">重新连接</button>
  </main>
</body>
</html>
